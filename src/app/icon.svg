<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Apple-Grade Electric Sapphire & Cyan Gradient (Safety & Digital) -->
    <linearGradient id="ehs-grad-alpha" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#00c7be" />
    </linearGradient>

    <!-- Master Emerald to Azure Gradient (Environment & Health) -->
    <linearGradient id="ehs-grad-beta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="50%" stop-color="#00c7be" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <!-- Master Deep Cobalt Gradient (Process Safety & Foundation Anchor) -->
    <linearGradient id="ehs-grad-gamma" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#005bb5" />
      <stop offset="60%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#5856d6" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 1)">
    <!-- 
      RIBBON 1: THE LEFT WING & UPPER SHIELD ARCH
      Forms the strong vertical spine of 'B', curves over the crest,
      and sweeps inward to create the upper teardrop loop.
    -->
    <path
      d="M 50 10
         C 32 10 17 22 15 42
         C 13 58 22 72 34 80
         C 36 81.5 38.5 79.8 37.5 77.8
         C 28 62 26 50 28 38
         C 30 27 38 20 50 20
         C 61 20 70 27 72 36
         C 72.8 39.5 76 39.5 77 37
         C 78 34 76.5 29.5 73.5 25
         C 67 15 59 10 50 10 Z"
      fill="url(#ehs-grad-alpha)"
    />

    <!-- 
      RIBBON 2: THE RIGHT WING & 'P' HEAD
      Arches over the right shoulder, hugs the shield's aerodynamic flank,
      and loops back into the core, forming the 'P' lobe and interlocking over Ribbon 1.
    -->
    <path
      d="M 50 20
         C 62 20 74 29 76 43
         C 77.5 54 72 64 62 70.5
         C 60 72 61 75 63 74
         C 75 66 83 54 85 40
         C 87 22 73 10 51 10
         C 46 10 40 11.5 36 14
         C 34 15.5 34.5 18.5 37 19.5
         C 41 20 45 20 50 20 Z"
      fill="url(#ehs-grad-beta)"
    />

    <!-- 
      RIBBON 3: THE FOUNDATION & SAFETY APEX
      Anchors the protective base of the shield at (50, 91),
      sweeping upward to embrace the central nexus and complete the lower 'B' loop.
    -->
    <path
      d="M 50 91
         C 47.5 91 45.5 89 44 86.5
         C 35 72.5 30 57.5 34 44
         C 34.5 41.5 37.5 41.5 38.5 44
         C 40.5 53 44 63.5 50 71.5
         C 56 63.5 59.5 53 61.5 44
         C 62.5 41.5 65.5 41.5 66 44
         C 70 57.5 65 72.5 56 86.5
         C 54.5 89 52.5 91 50 91 Z"
      fill="url(#ehs-grad-gamma)"
    />

    <!-- 
      THE DIGITAL PRISM CORE
      A floating 4-point diamond star in the center, symbolizing 
      the digital intelligence, zero-accident goal, and precision alignment of EHS.
    -->
    <path
      d="M 50 35
         L 56.5 46.5
         L 50 58
         L 43.5 46.5 Z"
      fill="#ffffff"
    />
  </g>
</svg>
